<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - StyleLink Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo">
          <h1>StyleLink<span class="brand-badge">Pro</span></h1>
        </div>
        <p class="brand-subtitle">Crie sua conta gratuitamente</p>
      </div>

      <!-- Trial Info -->
      <div class="trial-info">
        <p>✨ 7 dias de teste grátis</p>
        <p>🚀 Sem cartão de crédito</p>
      </div>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="storeName" class="form-label">
            Nome da Loja <span class="required">*</span>
          </label>
          <input
            type="text"
            id="storeName"
            class="form-input"
            placeholder="Ex: Minha Loja Fashion"
            autocomplete="organization"
            required>
        </div>

        <div class="form-group">
          <label for="storeSlug" class="form-label">
            Link da Loja <span class="required">*</span>
          </label>
          <div class="input-with-prefix">
            <span class="input-prefix">stylelink.com/</span>
            <input
              type="text"
              id="storeSlug"
              class="form-input"
              placeholder="minhaloja"
              autocomplete="off"
              required>
          </div>
          <small id="slugFeedback" class="field-feedback"></small>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">
            Email <span class="required">*</span>
          </label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="seu@email.com"
            autocomplete="email"
            required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Senha <span class="required">*</span>
          </label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required>
        </div>

        <button type="submit" class="btn btn-primary">
          Criar Conta Grátis
        </button>
      </form>

      <!-- Footer Links -->
      <div class="auth-footer">
        <p>Já tem conta? <a href="index.html">Faça login</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
