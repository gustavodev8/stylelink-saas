<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - StyleLink Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <h1>StyleLink</h1>
        <p>Crie sua conta gratuitamente</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="storeName">Nome da Loja *</label>
          <input type="text" id="storeName" placeholder="Ex: Minha Loja Fashion" required>
        </div>

        <div class="form-group">
          <label for="storeSlug">Link da Loja *</label>
          <div class="input-with-prefix">
            <span class="prefix">stylelink.com/</span>
            <input type="text" id="storeSlug" placeholder="minhaloja" required>
          </div>
          <small id="slugFeedback" class="field-feedback"></small>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Senha *</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <button type="submit" class="btn btn-primary">
          Criar Conta Grátis
        </button>
      </form>

      <p class="register-link">
        Já tem conta? <a href="index.html">Faça login</a>
      </p>

      <div class="trial-info">
        <p>✨ 7 dias de teste grátis</p>
        <p>🚀 Sem cartão de crédito</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
