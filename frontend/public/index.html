<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Loja - StyleLink</title>
  <link rel="stylesheet" href="css/template1.css">
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <header class="store-header">
      <div id="storeBanner" class="banner"></div>
      <div class="store-info">
        <img id="storeLogo" src="" alt="Logo" class="logo">
        <h1 id="storeName">-</h1>
        <p id="storeBio">-</p>
      </div>
    </header>

    <!-- Social Links -->
    <section id="socialSection" class="social-links">
      <!-- Links serão inseridos aqui via JS -->
    </section>

    <!-- Products Featured -->
    <section id="featuredSection" class="products-section">
      <h2>Destaques</h2>
      <div id="featuredGrid" class="products-grid">
        <!-- Produtos em destaque serão inseridos aqui -->
      </div>
    </section>

    <!-- All Products -->
    <section class="products-section">
      <h2>Todos os Produtos</h2>
      <div id="productsGrid" class="products-grid">
        <!-- Produtos serão inseridos aqui -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="store-footer">
      <p>Feito com <span style="color: #ef4444;">♥</span> usando <a href="https://stylelink.com" target="_blank">StyleLink</a></p>
    </footer>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalBody">
        <!-- Conteúdo do produto será inserido aqui -->
      </div>
    </div>
  </div>

  <script src="js/public.js"></script>
</body>
</html>
